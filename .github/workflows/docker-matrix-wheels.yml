name: Matrix-build-wheels

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'releases/**'
      - 'push-action/**'

  release:
    types: [ published  ]

  schedule:
    - cron: '45 4 * * 0'
    
jobs:
  prepare_build:
    if: ${{ !startsWith(github.ref, 'refs/heads/push-action') }}
    runs-on: ${{ matrix.runner }}
    outputs:
      fhempyV: ${{steps.split_fhempyV.outputs.result}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            archdir: linux_amd64
            scope: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            archdir: linux_arm64
            scope: arm64
          # armv7 is emulated (QEMU), the arm64 runners can't run AArch32 natively
          - platform: linux/arm/v7
            runner: ubuntu-24.04-arm
            archdir: linux_arm_v7
            scope: armv7
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          filter: tree:0

      - name: Split fhempy Version
        id: split_fhempyV
        run: |
          echo "result=$(grep '^fhempy' requirements.txt | cut -d '=' -f3)" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        if: matrix.scope == 'armv7'
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            image=moby/buildkit:latest

      - name: Get Python version from Dockerfile
        id: cache-key
        run: |
          image_version=$(grep -m 1 '^FROM' Dockerfile | cut -d ' ' -f2 | cut -d ':' -f2 | cut -d '@' -f1)
          echo "IMAGE_VERSION_SHORT=${image_version%.*}" >> $GITHUB_ENV
          echo "IMAGE_VERSION=${image_version}" >> $GITHUB_ENV

      # one cache per architecture, otherwise parallel jobs would try to save the same key
      # the unprefixed wheels-<pyver> keys are the old shared caches (both archs inside), kept as fallback
      - name: Init wheels cache
        id: cache-wheels
        uses: actions/cache@v6
        with:
          path: ./wheelhouse
          key: wheels-${{ matrix.archdir }}-${{ env.IMAGE_VERSION }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            wheels-${{ matrix.archdir }}-${{ env.IMAGE_VERSION }}
            wheels-${{ matrix.archdir }}-${{ env.IMAGE_VERSION_SHORT }}
            wheels-${{ matrix.archdir }}-
            wheels-${{ env.IMAGE_VERSION }}
            wheels-${{ env.IMAGE_VERSION_SHORT }}

      - name: create cachedir
        run: mkdir -p ./wheelhouse/${{ matrix.archdir }}

      - name: Build base wheels and export to cache
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          target: export-stage
          cache-to: type=gha,mode=max,scope=wheel_builder_stage_${{ matrix.scope }}
          cache-from: type=gha,scope=wheel_builder_stage_${{ matrix.scope }}
          load: false
          outputs: type=local,dest=./wheelhouse/${{ matrix.archdir }}

      - name: Build base image and export to cache
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          target: base
          cache-from: type=gha,scope=base_image_stage_${{ matrix.scope }}
          cache-to: type=gha,scope=base_image_stage_${{ matrix.scope }},mode=max
          load: false

      - name: generate requierementsfile for extra requirements
        run: |
          #echo "cryptography" >> requirements_extra.txt
          echo "pyaml" >> requirements_extra.txt

      - name: Build extra wheels
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          target: export-stage
          load: false
          cache-from: type=gha,scope=wheel_builder_stage_${{ matrix.scope }}
          outputs: type=local,dest=./wheelhouse/${{ matrix.archdir }}
          build-args:
            REQUIREMENTS_FILE=requirements_extra.txt

  prepare_matrix:
    #name:  Find fhempy modules 
    #needs: prepare_build
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{steps.getModules.outputs.matrix}}
      matrix_platforms: ${{steps.crossPlatforms.outputs.matrix}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          filter: tree:0

      - name: Split fhempy Version
        run: |
          echo "fhempyVersion=$(grep '^fhempy' requirements.txt | cut -d '=' -f3)" >> $GITHUB_ENV

      - uses: actions/checkout@v7
        with:
          repository: 'fhempy/fhempy'
          path: fhempyRepo
          filter: tree:0
          ref: 'v${{ env.fhempyVersion }}'

      - name: Get module names and prepare matrix
        id: getModules
        working-directory: ./fhempyRepo/FHEM/bindings/python/fhempy/lib
        run: |
          ${GITHUB_WORKSPACE}/scripts/get-deps.sh .
        shell: bash

      - name: Combine modules with platforms
        id: crossPlatforms
        env:
          MODULES: ${{ steps.getModules.outputs.matrix }}
        run: |
          PLATFORMS='[
            {"platform":"linux/amd64","runner":"ubuntu-latest","archdir":"linux_amd64","scope":"amd64"},
            {"platform":"linux/arm64","runner":"ubuntu-24.04-arm","archdir":"linux_arm64","scope":"arm64"},
            {"platform":"linux/arm/v7","runner":"ubuntu-24.04-arm","archdir":"linux_arm_v7","scope":"armv7"}
          ]'
          echo "matrix=$(echo "$MODULES" | jq -c --argjson p "$PLATFORMS" '{include: [.include[] as $m | $p[] | $m + .]}')" >> $GITHUB_OUTPUT


  buildImages:
    runs-on: ${{ matrix.runner }}
    needs: [prepare_build, prepare_matrix]
    if: ${{ !startsWith(github.ref, 'refs/heads/push-action') }}
    permissions:
      contents: write
      packages: write
    env:
      # Use docker.io for Docker Hub if empty
      REGISTRY: ghcr.io
      # github.repository as <account>/<repo>
      IMAGE_NAME: ${{ github.repository }}
    strategy:
      max-parallel: 10
      fail-fast: false
      matrix:
        # module x platform (see prepare_matrix)
        ${{fromJson(needs.prepare_matrix.outputs.matrix_platforms)}}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          filter: tree:0

      - name: check variables
        run: |
          echo '${{ toJSON(matrix) }}'
          echo '${{ matrix.module }}'

      - name: write requirement for mod from matrix input
        run: |
          touch ./requirements_mod.txt
          echo '${{toJSON(matrix.requirements)}}' | jq --raw-output -e '.[]' > ./requirements_mod.txt || true
          cat ./requirements_mod.txt

      # arm runners are skipped, not verified to work there
      - name: Run Docker on tmpfs
        if: matrix.runner == 'ubuntu-latest'
        uses: sidey79/docker-on-tmpfs@main
        with:
          tmpfs_size: 6
          swap_size: 4
          swap_location: '/mnt/swapfile'

      - name: Set up QEMU
        if: matrix.scope == 'armv7'
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            image=moby/buildkit:latest

      - name: Get Python version from Dockerfile
        id: cache-key
        run: |
          image_version=$(grep -m 1 '^FROM' Dockerfile | cut -d ' ' -f2 | cut -d ':' -f2 | cut -d '@' -f1)
          echo "IMAGE_VERSION_SHORT=${image_version%.*}" >> $GITHUB_ENV
          echo "IMAGE_VERSION=${image_version}" >> $GITHUB_ENV

      - uses: Wandalen/wretry.action@v3.8.0
        name: restore base cache with retry
        id: cache
        with:
          attempt_delay: 35000
          attempt_limit: 3
          action: actions/cache/restore@v4
          with: |
            path: ./wheelhouse
            fail-on-cache-miss: true
            key: wheels-${{ matrix.archdir }}-${{ env.IMAGE_VERSION }}-${{ hashFiles('requirements.txt') }}

      - name: Init wheels cache
        id: cache-wheels-restore
        uses: actions/cache/restore@v6
        with:
          path: ./wheelhouse
          key: wheels-${{ matrix.module }}-${{ matrix.archdir }}-${{ env.IMAGE_VERSION }}
          restore-keys: |
            wheels-${{ matrix.module }}-${{ matrix.archdir }}-${{ env.IMAGE_VERSION }}
            wheels-${{ matrix.module }}-${{ matrix.archdir }}-
            wheels-${{ matrix.archdir }}-${{ env.IMAGE_VERSION }}-${{ hashFiles('requirements.txt') }}
            wheels-${{ matrix.archdir }}-${{ env.IMAGE_VERSION }}

      - name: create cachedir if not exists
        run: |
          mkdir -p ./wheelhouse/${{ matrix.archdir }}

      - name: Build wheels for mod ${{ matrix.module }}
        uses: docker/build-push-action@v7.4.0
        timeout-minutes: 75
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: false
          target: export-stage
          cache-from: type=gha,scope=wheel_builder_stage_${{ matrix.scope }}
          build-args: |
            REQUIREMENTS_FILE=requirements_mod.txt
          outputs: type=local,dest=./wheelhouse/${{ matrix.archdir }}

      - name: save wheels cache
        id: cache-wheels-save
        if: always() && steps.cache-wheels-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ./wheelhouse
          key: ${{ steps.cache-wheels-restore.outputs.cache-primary-key }}

      - name: save as artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.module }}-${{ matrix.archdir }}
          path: ./wheelhouse

      # armv7 is only emulated and therefore not tested
      - name: Build for integration test
        id: build-it
        if: matrix.scope != 'armv7'
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          target: runtime
          cache-from: |
            type=gha,scope=base_image_stage_${{ matrix.scope }}
          build-args: |
            REQUIREMENTS_FILE=requirements_mod.txt

      - name: Show image architecture
        if: matrix.scope != 'armv7'
        run: docker image inspect --format '{{.Os}}/{{.Architecture}}{{if .Variant}}/{{.Variant}}{{end}}' ${{ steps.build-it.outputs.imageid }}

      - name: Run integration tests
        if: matrix.scope != 'armv7'
        shell: bash
        run: |
          ./scripts/test-integration.sh ${{ steps.build-it.outputs.imageid }}

      # Login against a Docker registry if it is a release
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name == 'release'
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}_${{ matrix.module }}
          labels: |
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}_${{ matrix.module }}

      # Every platform is pushed by digest only, the tags are set on the manifest list in the merge job
      - name: Build and push Docker image by digest
        uses: docker/build-push-action@v7.4.0
        id: docker_build_runtime
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          target: runtime
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}_${{ matrix.module }},push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'release' }}
          cache-from: |
            type=gha,scope=base_image_stage_${{ matrix.scope }}
          build-args: |
            PKGS=${{ matrix.PKGS }}

      # Marker for the merge job: contains the digest on release, only a placeholder otherwise
      - name: Export digest
        env:
          DIGEST: ${{ steps.docker_build_runtime.outputs.digest }}
        run: |
          mkdir -p ${{ runner.temp }}/digests
          if [ "${{ github.event_name }}" == "release" ]; then
            touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"
          else
            touch "${{ runner.temp }}/digests/none-${{ matrix.archdir }}"
          fi

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.module }}-${{ matrix.archdir }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: [buildImages, prepare_matrix]
    # run per module, even if other modules failed; a module with a failed platform fails in "check digests"
    if: ${{ always() && !cancelled() && needs.buildImages.result != 'skipped' }}
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    strategy:
      fail-fast: false
      matrix:
        ${{fromJson(needs.prepare_matrix.outputs.matrix)}}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.module }}-*
          merge-multiple: true

      - name: check digests
        working-directory: ${{ runner.temp }}/digests
        run: |
          ls -l
          # amd64, arm64, armv7
          [ "$(ls | wc -l)" -eq 3 ] || { echo "digests of not all platforms available for ${{ matrix.module }}"; exit 1; }

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}_${{ matrix.module }}
          flavor: |
             latest= ${{ fromJSON('["auto", "false"]')[github.event.release.prerelease == 1] }}
          tags: |
            type=ref,enable=true,priority=600,prefix=pr-,suffix=,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}},enable=${{ github.event.release.prerelease == 0 }}
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}_${{ matrix.module }}

      - name: check tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          [ -n "${TAGS}" ] || { echo "::error::No image tag generated for ref ${{ github.ref }}, release tags must be valid semver, e.g. v2.0.0 or v2.0.0-alpha.1"; exit 1; }

      - name: Install cosign
        if: github.event_name == 'release'
        uses: sigstore/cosign-installer@v4.1.2

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name == 'release'
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        if: github.event_name == 'release'
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}_${{ matrix.module }}@sha256:%s ' *)

      # Sign the resulting manifest digest, only on release
      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image
        if: github.event_name == 'release'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          FIRST_TAG=$(echo "${TAGS}" | head -n 1)
          DIGEST=$(docker buildx imagetools inspect "${FIRST_TAG}" --format '{{.Manifest.Digest}}')
          docker buildx imagetools inspect "${FIRST_TAG}"
          echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}

      - name: Create Job Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          IMAGE_NAMES=$(echo "${TAGS}" | paste -sd, -)
          echo "### Image report for : ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "| Module | Image name  |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|----------------------------------------------------------------------|" >> $GITHUB_STEP_SUMMARY
          echo "| ${{ matrix.module }} | ${IMAGE_NAMES} |" >> $GITHUB_STEP_SUMMARY
          echo "| ${{ matrix.module }} | ${IMAGE_NAMES} |" > ${{ matrix.module }}_result.md

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: artifact-${{ matrix.module }}
          path: ${{ matrix.module }}_result.md
          if-no-files-found: warn

  check-matrix:
    runs-on: ubuntu-latest
    needs: [merge,prepare_build]
    if: always() && !failure() && !cancelled() 
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - uses: actions/download-artifact@v8
        if: ${{ !startsWith(github.ref, 'refs/heads/push-action') }}
        with:
          pattern: artifact-*
          merge-multiple: true
          path: build-artifact
           

      - name: Find image String
        if: ${{ !startsWith(github.ref, 'refs/heads/push-action') }}  
        id: extract_image
        run: |
          echo "image_name=$(grep -m 1 '^FROM' Dockerfile | cut -d ' ' -f2 | cut -d ':' -f1)" >> $GITHUB_OUTPUT
          echo "image_version=$(grep -m 1 '^FROM' Dockerfile | cut -d ' ' -f2 | cut -d ':' -f2 | cut -d '@' -f1)" >> $GITHUB_OUTPUT
         
      - name: Update docs (readme.md)
        if: ${{ !startsWith(github.ref, 'refs/heads/push-action') }}
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Image tag for the examples: semver releases are published without "v" (1.8.0),
          # other tags only as they are named (see "Extract Docker metadata")
          IMAGE_TAG="$REF_NAME"
          if [[ "$IMAGE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            IMAGE_TAG="${IMAGE_TAG#v}"
          fi
          cat build-artifact/*_result.md  > modules.md
          IMAGE_LIST=$(cat modules.md)
          echo "$IMAGE_LIST"
          ESCAPED_DATA="$(echo "${IMAGE_LIST}" | sed 's/\n/\\n/g')"
          echo "--------"
          echo "$ESCAPED_DATA"
          sed -e "s/{FHEMPY_VERSION}/${{ needs.prepare_build.outputs.fhempyV }}/" -e "s/{PYTHON_VERSION}/${{ steps.extract_image.outputs.image_version}}/" -e "s/{DEBIAN_RELEASE}/trixie/" -e "s,{IMAGE_TAG},${IMAGE_TAG}," < README.tmpl > README.md
          sed -i -e "/{MODULES_IMAGE_LIST}/r modules.md" -e "/{MODULES_IMAGE_LIST}/d" README.md

      - name: Upload artifact
        if: ${{ !startsWith(github.ref, 'refs/heads/push-action') }}
        uses: actions/upload-artifact@v7
        with:
          name: readme
          path: README.md
          if-no-files-found: warn
  
      - name: git commit README.md 
        id: commit
        if: ${{ github.event_name == 'release' }}
        run: |
          git config --global user.email "action@github.com"
          git config --local user.name "GitHub Action"
            git commit -m "README.md: Update Versions" -a && echo "status=true" >> $GITHUB_OUTPUT || true
      
      - name: Push back to protected branch (main)
        uses: CasperWA/push-protected@v2
        if: ${{ github.event_name == 'release' }}
        with:
          token: ${{ secrets.BOT_PUSH_TOKEN }}
          branch: main
          pre_sleep: 60
          timeout: 60

      - name: Set step summary
        if: ${{ !startsWith(github.ref, 'refs/heads/push-action') }}  
        run: |
          cat README.md >> $GITHUB_STEP_SUMMARY
